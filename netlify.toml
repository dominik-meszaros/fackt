[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[[headers]]
  for = "/uploads/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# CMS lives at /admin
[[redirects]]
  from = "/admin"
  to = "/admin/index.html"
  status = 200
