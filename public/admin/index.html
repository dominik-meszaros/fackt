<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>Fackt CMS</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
</head>
<body>
  <!-- Shortcut to the stats dashboard (public/admin/stats.html). -->
  <a href="/admin/stats" style="position:fixed;right:16px;bottom:16px;z-index:9999;display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 14px;border-radius:3px;background:#111;color:#fff;font:500 13.5px system-ui,sans-serif;text-decoration:none;box-shadow:2px 2px 0 #c9c9c4">Stats &#8599;</a>
  <script>window.CMS_MANUAL_INIT = true;</script>
  <script src="https://unpkg.com/decap-cms@3.3.3/dist/decap-cms.js"></script>
  <script>
    // Log in through this site's own /api/auth (functions/api), on whatever domain it runs.
    CMS.init({ config: { backend: { name: 'github', repo: 'dominik-meszaros/fackt', branch: 'main', base_url: location.origin, auth_endpoint: 'api/auth' } } });
  </script>
</body>
</html>
