# Fackt CMS (Decap). Open /admin on the live site, log in with GitHub, edit, publish.
# Every publish commits to the repo and Netlify redeploys the site (about a minute).
# Local editing without GitHub: run `npx decap-server` next to `npm run dev`, then open /admin.

backend:
  name: github
  repo: dominik-meszaros/fackt
  branch: main
  auth_endpoint: api/auth # base_url is set to the site's own address in admin/index.html
  commit_messages:
    create: 'CMS: add {{collection}} "{{slug}}"'
    update: 'CMS: update {{collection}} "{{slug}}"'
    delete: 'CMS: delete {{collection}} "{{slug}}"'
    uploadMedia: 'CMS: upload {{path}}'
    deleteMedia: 'CMS: delete {{path}}'

local_backend: true
site_url: https://fackt.io
display_url: https://fackt.io
logo_url: /favicon.svg

media_folder: public/uploads
public_folder: /uploads

# Editing happens in the form; check the live site after publishing.
collections:
  # ---------- single pages ----------
  - name: settings
    editor: { preview: false }
    label: Settings
    files:
      - name: home
        label: Homepage
        file: src/content/settings/home.json
        format: json
        fields:
          - { name: heroTitle, label: "Hero title", widget: string }
          - { name: heroTitleMuted, label: "Hero title, grey line", widget: string }
          - { name: heroText, label: "Hero text", widget: text }
          - name: askHints
            label: Ask bar, rotating example questions
            widget: list
            field: { name: hint, label: "Question", widget: string }
          - name: ask
            label: Ask bar, suggestions
            label_singular: Suggestion
            hint: 'Work suggestions switch the project in the hero stage. Answer suggestions show the answer inline. Only state facts that are on the site.'
            widget: list
            summary: '{{fields.question}}'
            fields:
              - { name: question, label: "Question", widget: string }
              - { name: type, label: "Type", widget: select, options: [{ label: 'Shows a project', value: work }, { label: 'Shows an answer', value: answer }], default: answer }
              - { name: project, label: "Project (for \"Shows a project\")", widget: relation, collection: work, value_field: '{{slug}}', search_fields: [name, service], display_fields: ['{{name}}, {{service}}'], required: false }
              - { name: answer, label: "Answer (for \"Shows an answer\")", widget: text, required: false }
              - { name: linkLabel, label: "Answer link label", widget: string, required: false }
              - { name: linkHref, label: "Answer link", widget: string, required: false, hint: 'e.g. /#pricing, /#process, /book' }
          - { name: logosTitle, label: "Logos title", widget: string }
          - name: logos
            label: Logos
            label_singular: Logo
            widget: list
            summary: '{{fields.name}}'
            fields:
              - { name: name, label: "Company name", widget: string }
              - { name: logo, label: "Logo image (optional, shown in grey)", widget: image, required: false, choose_url: false }
          - name: rating
            label: Rating line in testimonials
            widget: object
            fields:
              - { name: value, label: "Rating", widget: string }
              - { name: source, label: "Source", widget: string }
      - name: pricing
        label: Pricing
        file: src/content/settings/pricing.json
        format: json
        fields:
          - { name: title, label: "Section title", widget: string }
          - { name: text, label: "Section text", widget: string }
          - name: plans
            label: Plans
            label_singular: Plan
            widget: list
            summary: '{{fields.name}}, {{fields.price}}'
            fields:
              - { name: name, label: "Name", widget: string }
              - { name: prefix, label: "Before price (e.g. \"from\")", widget: string, required: false }
              - { name: price, label: "Price", widget: string }
              - { name: period, label: "After price (e.g. \"/ month\")", widget: string, required: false }
              - { name: badge, label: "Badge", widget: string, required: false }
              - { name: text, label: "Short description", widget: string }
              - { name: items, label: "Included", widget: list, field: { name: item, label: "Item", widget: string } }
              - { name: cta, label: "Button label", widget: string }
              - { name: ctaHref, label: "Button link", widget: string, default: /book }
              - { name: dark, label: "Dark card", widget: boolean, default: false }

      - name: audit
        label: Free audit page
        file: src/content/settings/audit.json
        format: json
        fields:
          - { name: eyebrow, label: "Label above the title", widget: string }
          - { name: title, label: "Title", widget: string }
          - { name: text, label: "Intro text", widget: text }
          - { name: turnaround, label: "Turnaround tag on the form", widget: string }
          - name: deliverables
            label: What they get
            label_singular: Item
            widget: list
            summary: '{{fields.title}}'
            fields:
              - { name: icon, label: "Icon", widget: select, options: [video, doc] }
              - { name: title, label: "Title", widget: string }
              - { name: text, label: "Text", widget: text }
          - { name: steps, label: "Old short steps (not shown on the page)", widget: list, required: false, field: { name: step, label: Step, widget: string } }
          - { name: ticks, label: "Ticks under the intro", widget: list, required: false, field: { name: tick, label: Tick, widget: string } }
          - { name: videoLength, label: "Video length note", widget: string, required: false }
          - name: how
            label: How it works
            label_singular: Step
            widget: list
            required: false
            summary: '{{fields.title}}'
            fields:
              - { name: title, label: "Title", widget: string }
              - { name: text, label: "Text", widget: text }
          - name: faq
            label: Questions
            label_singular: Question
            widget: list
            required: false
            summary: '{{fields.q}}'
            fields:
              - { name: q, label: "Question", widget: string }
              - { name: a, label: "Answer", widget: text }
          - { name: focusOptions, label: "Form: what should we look at? (options)", widget: list, field: { name: option, label: Option, widget: string } }
          - { name: stageOptions, label: "Form: where is the product now? (options)", widget: list, field: { name: option, label: Option, widget: string } }
          - { name: button, label: "Button label", widget: string }
          - { name: success, label: "Message after sending", widget: string }

  # ---------- lists ----------
  - name: quotes
    editor: { preview: false }
    label: Hero quotes
    label_singular: Hero quote
    folder: src/content/quotes
    format: json
    extension: json
    create: true
    slug: '{{name}}'
    identifier_field: name
    summary: '{{name}}, {{role}}'
    sortable_fields: [order, name]
    fields:
      - { name: name, label: "Name", widget: string }
      - { name: role, label: "Role and company", widget: string }
      - { name: quote, label: "Quote (word for word from the review)", widget: text }
      - { name: photo, label: "Photo (optional, otherwise initials)", widget: image, required: false, choose_url: false }
      - { name: link, label: "Source link (optional: the X post or review it came from)", widget: string, required: false }
      - { name: order, label: "Order", widget: number, value_type: int, default: 99 }

  - name: work
    editor: { preview: false }
    label: Work
    label_singular: Project
    folder: src/content/work
    format: frontmatter
    extension: md
    create: true
    slug: '{{name}}'
    identifier_field: name
    summary: '{{name}}, {{service}}'
    sortable_fields: [order, name]
    fields:
      - { name: name, label: "Name", widget: string }
      - { name: service, label: "Service", widget: string }
      - { name: category, label: "Category", widget: select, options: [product, web, mobile, branding, motion] }
      - { name: summary, label: "Summary", widget: text }
      - { name: image, label: "Image", widget: image, choose_url: false, hint: "Product screen, shown framed in the homepage stage and the search" }
      - { name: preview, label: "Preview image (optional)", widget: image, choose_url: false, required: false, hint: "Full-bleed image for the work cards and the case study hero, like a brand board" }
      - { name: imageKind, label: "Image shape", widget: select, options: [desktop, phone], default: desktop }
      - { name: tint, label: "Case study tint", widget: select, options: [blue, peach, mint, lilac], default: blue }
      - { name: keywords, label: "Search keywords", widget: list, required: false, hint: 'Words people might type in the ask bar to find this project.' }
      - { name: year, label: "Year", widget: string, required: false }
      - { name: featured, label: "Show in Selected work", widget: boolean, default: false }
      - { name: order, label: "Order", widget: number, value_type: int, default: 99 }
      - { name: stage, label: "Show in hero stage", widget: boolean, default: false }
      - { name: stageLabel, label: "Hero chip label (e.g. \"SaaS dashboard\")", widget: string, required: false }
      - { name: stageQuery, label: "Hero phrase (e.g. \"a SaaS dashboard\")", widget: string, required: false }
      - { name: stageOrder, label: "Hero order", widget: number, value_type: int, default: 99 }
      - { name: stageImage, label: "Hero stage image (optional)", widget: image, choose_url: false, required: false, hint: "Wide 2:1 image shown full bleed in the hero stage" }
      - { name: platform, label: "Case study: platform (e.g. \"Web app\")", widget: string, required: false }
      - { name: scope, label: "Case study: scope", widget: string, required: false }
      - { name: challengeTitle, label: "Challenge: one line", widget: string, required: false }
      - { name: challenge, label: "Challenge: text", widget: text, required: false }
      - { name: approachTitle, label: "What we did: one line", widget: string, required: false }
      - { name: approach, label: "What we did: text", widget: text, required: false }
      - { name: resultsTitle, label: "Results: one line", widget: string, required: false }
      - name: results
        label: "Results (real numbers only)"
        widget: list
        required: false
        fields:
          - { name: value, label: "Number", widget: string }
          - { name: label, label: "What it measures", widget: string }
      - name: gallery
        label: "Screens"
        widget: list
        required: false
        fields:
          - { name: image, label: "Image", widget: image, choose_url: false }
          - { name: caption, label: "Caption", widget: string, required: false }
          - { name: kind, label: "Shape", widget: select, options: [desktop, phone, board], default: desktop, hint: "board = full-width presentation image under the write-up" }
      - { name: quote, label: "Client quote (word for word)", widget: text, required: false }
      - { name: quoteName, label: "Quote: name", widget: string, required: false }
      - { name: quoteRole, label: "Quote: role and company", widget: string, required: false }
      - { name: quotePhoto, label: "Quote: photo", widget: image, required: false, choose_url: false }
      - { name: body, label: "Case study (extra notes, shown when the sections above are empty)", widget: markdown }

  - name: videos
    editor: { preview: false }
    label: Video testimonials
    label_singular: Video testimonial
    folder: src/content/videos
    format: json
    extension: json
    create: true
    slug: '{{name}}'
    identifier_field: name
    summary: '{{name}}, {{company}}'
    sortable_fields: [order, name]
    fields:
      - { name: name, label: "Name", widget: string }
      - { name: role, label: "Role", widget: string }
      - { name: company, label: "Company", widget: string }
      - { name: duration, label: "Duration (e.g. 0:42)", widget: string, required: false }
      - { name: thumbnail, label: "Thumbnail (portrait 4:5)", widget: image, choose_url: false }
      - { name: video, label: "Video URL (mp4, optional)", widget: string, required: false, hint: 'Paste a link to an mp4 (for example from Mux, Cloudflare Stream or Bunny). With a link the tile plays the video.' }
      - { name: order, label: "Order", widget: number, value_type: int, default: 99 }

  - name: reviews
    editor: { preview: false }
    label: Written reviews
    label_singular: Written review
    folder: src/content/reviews
    format: json
    extension: json
    create: true
    slug: '{{name}}'
    identifier_field: name
    summary: '{{name}}, {{role}}'
    sortable_fields: [order, name]
    fields:
      - { name: name, label: "Name", widget: string }
      - { name: role, label: "Role and company", widget: string }
      - { name: highlight, label: "Highlight (a phrase from the review)", widget: string }
      - { name: text, label: "Full review", widget: text }
      - { name: link, label: "Source link (optional: the X post or review it came from)", widget: string, required: false }
      - { name: order, label: "Order", widget: number, value_type: int, default: 99 }

  - name: blog
    editor: { preview: false }
    label: Blog
    label_singular: Note
    description: 'Fackt notes. New notes start as a draft: they are built at fackt.io/blog/<slug> for you to read, but not listed or indexed. Switch off "Draft" to publish.'
    folder: src/content/blog
    create: true
    slug: '{{slug}}'
    extension: md
    format: frontmatter
    sortable_fields: [date, title]
    summary: '{{title}} · {{category}}'
    fields:
      - { name: title, label: Title, widget: string }
      - { name: description, label: "Short description (shown under the title and in Google)", widget: text }
      - { name: category, label: Category, widget: string, hint: 'e.g. Pricing, Audit, Onboarding, Branding' }
      - { name: cover, label: "Cover image (1600 x 900)", widget: image, choose_url: false }
      - { name: date, label: Date, widget: datetime, date_format: 'YYYY-MM-DD', time_format: false, format: 'YYYY-MM-DD' }
      - { name: readTime, label: "Read time (optional, e.g. 6 min)", widget: string, required: false }
      - { name: related, label: "Related case study (optional)", widget: relation, collection: work, value_field: '{{slug}}', search_fields: [name, service], display_fields: ['{{name}}, {{service}}'], required: false }
      - { name: draft, label: Draft, widget: boolean, default: true }
      - { name: body, label: Text, widget: markdown }
  - name: free
    label: Free files
    label_singular: Free file
    folder: src/content/free
    create: true
    slug: '{{fields.slug}}'
    identifier_field: title
    summary: '{{title}} · fackt.io/free/{{slug}}'
    description: 'One page per free Figma file, at fackt.io/free/<slug>. The Figma link is NOT here: add it in Supabase > Table editor > list_resources, in a row with the same slug, so it only goes out by email.'
    fields:
      - { label: 'Address (slug)', name: slug, widget: string, hint: 'Short, easy to say in a video: login-page, onboarding. Must match the slug in Supabase.' }
      - { label: 'Title', name: title, widget: string, hint: 'What the file is, e.g. SaaS login page. Used in emails.' }
      - { label: 'Headline', name: headline, widget: string, hint: 'What they get, e.g. The SaaS login page from the video, free in Figma' }
      - { label: 'Short line under the headline', name: lede, widget: text }
      - { label: 'Google description', name: description, widget: text, hint: '120 to 155 characters.' }
      - { label: 'Preview image', name: preview, widget: image, hint: 'A big export of the main frame, about 1600 x 1100.' }
      - { label: 'Preview is a sketch placeholder', name: previewIsSketch, widget: boolean, default: false, required: false }
      - { label: 'YouTube video link', name: videoUrl, widget: string, required: false }
      - { label: 'What is inside (3 bullets)', name: inside, widget: list, field: { label: Bullet, name: item, widget: string }, required: false }
      - { label: 'Button text', name: button, widget: string, default: 'Send me the file' }
      - { label: 'Draft (hidden from Google)', name: draft, widget: boolean, default: true }
